<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Save Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1>🧪 Test de Guardado de Productos</h1>
    
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Test de Conexión</h5>
                </div>
                <div class="card-body">
                    <button class="btn btn-primary" onclick="testConnection()">Probar Conexión</button>
                    <div id="connectionResult" class="mt-3"></div>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5>Test de Guardado</h5>
                </div>
                <div class="card-body">
                    <form id="testForm">
                        <div class="mb-2">
                            <input type="text" class="form-control" id="sku" placeholder="SKU" value="TEST-001">
                        </div>
                        <div class="mb-2">
                            <input type="text" class="form-control" id="nombre" placeholder="Nombre" value="Producto Test">
                        </div>
                        <div class="mb-2">
                            <input type="number" class="form-control" id="precio" placeholder="Precio" value="100">
                        </div>
                        <button type="button" class="btn btn-success" onclick="testSave()">Probar Guardado</button>
                    </form>
                    <div id="saveResult" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-4">
        <div class="card">
            <div class="card-header">
                <h5>Test API Original</h5>
            </div>
            <div class="card-body">
                <button class="btn btn-warning" onclick="testOriginalAPI()">Probar API Original</button>
                <div id="originalAPIResult" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('connectionResult');
            resultDiv.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Probando...';
            
            try {
                const response = await fetch('./test-save-producto.php');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            ✅ ${data.message}<br>
                            Productos en BD: ${data.products_count}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            ❌ Error: ${data.error}<br>
                            <pre>${JSON.stringify(data.details, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        ❌ Error de conexión: ${error.message}
                    </div>
                `;
            }
        }

        async function testSave() {
            const resultDiv = document.getElementById('saveResult');
            resultDiv.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Guardando...';
            
            const productData = {
                sku: document.getElementById('sku').value,
                nombre: document.getElementById('nombre').value,
                precio: parseFloat(document.getElementById('precio').value),
                descripcion: 'Producto de prueba',
                stock: 10,
                esta_activo: 1,
                destacado: 0
            };
            
            try {
                const response = await fetch('./test-save-producto.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(productData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            ✅ ${data.message}<br>
                            ID: ${data.id}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            ❌ Error: ${data.error}<br>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        ❌ Error de conexión: ${error.message}
                    </div>
                `;
            }
        }

        async function testOriginalAPI() {
            const resultDiv = document.getElementById('originalAPIResult');
            resultDiv.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Probando API original...';
            
            try {
                const response = await fetch('./api/productos.php');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            ✅ API original funcionando<br>
                            Productos: ${data.productos.length}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-danger">
                            ❌ Error API original: ${data.error}<br>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-danger">
                        ❌ Error conexión API original: ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
