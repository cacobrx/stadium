<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Stadium</title>
    <link rel="icon" type="image/jpeg" href="includes/fav.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1>🔧 Diagnóstico del Sistema Stadium</h1>
    
    <div id="status"></div>
    
    <hr>
    
    <div class="row">
        <div class="col-6">
            <h3>📊 Datos de Productos</h3>
            <button class="btn btn-primary" onclick="loadProducts()">Cargar Productos</button>
            <div id="products-result" class="mt-3"></div>
        </div>
        
        <div class="col-6">
            <h3>🏷️ Datos de Marcas</h3>
            <button class="btn btn-success" onclick="loadMarcas()">Cargar Marcas</button>
            <div id="marcas-result" class="mt-3"></div>
        </div>
    </div>
    
    <hr>
    
    <div class="row">
        <div class="col-12">
            <h3>🖼️ Vista de Artículos Simplificada</h3>
            <div id="simple-view" class="mt-3"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('status').innerHTML = `
                <div class="alert alert-info">
                    <strong>✅ Sistema Cargado</strong><br>
                    Hora: ${new Date().toLocaleString()}<br>
                    URL Base: ${window.location.origin}
                </div>
            `;
        });

        async function loadProducts() {
            const resultDiv = document.getElementById('products-result');
            resultDiv.innerHTML = '<div class="spinner-border" role="status"></div> Cargando...';
            
            try {
                const response = await fetch('./api/productos.php');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <strong>✅ ${data.productos.length} productos encontrados</strong>
                            <ul class="mt-2">
                                ${data.productos.map(p => `<li>${p.sku} - ${p.nombre} ($${p.precio})</li>`).join('')}
                            </ul>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ Error de conexión: ${error.message}</div>`;
            }
        }

        async function loadMarcas() {
            const resultDiv = document.getElementById('marcas-result');
            resultDiv.innerHTML = '<div class="spinner-border" role="status"></div> Cargando...';
            
            try {
                const response = await fetch('./api/marcas.php');
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            <strong>✅ ${data.marcas.length} marcas encontradas</strong>
                            <ul class="mt-2">
                                ${data.marcas.map(m => `<li>${m.nombre}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">❌ Error: ${data.error}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ Error de conexión: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
