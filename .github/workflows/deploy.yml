name: Deploy a producción (FTP)

# Se ejecuta con cada push a main, o a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Arma la carpeta a subir con el backend PHP (no hay build).
      # Los secretos no están en el repo, así que nunca se suben.
      - name: Armar paquete
        run: |
          mkdir -p deploy
          rsync -a \
            --exclude='.git*' --exclude='.github' --exclude='.claude' --exclude='deploy' \
            --exclude='sql' --exclude='database' --exclude='docs' --exclude='*.md' \
            ./ deploy/
          echo "Archivos a subir: $(find deploy -type f | wc -l)"

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_DIR || secrets.FTP_DIR }}
          local-dir: ./deploy/
          # Variable FTP_LOG_LEVEL=verbose para diagnosticar problemas de conexión
          log-level: ${{ vars.FTP_LOG_LEVEL || 'standard' }}
          # Nunca tocar en el servidor: secretos, archivos subidos por usuarios y logs
          exclude: |
            **/.git*
            **/.git*/**
            .htaccess
            config/database.php
            config/mail.php
            config/mercadopago.php
            config/correoargentino.php
            config/certs/**
            **/*.key
            **/*.pem
            uploads/**
            tmp/**
            log/**
